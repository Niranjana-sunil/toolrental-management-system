<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>ToolBox | Login</title>

    <!-- Font Awesome -->
    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

    <style>
/* =========================
   GLOBAL
========================= */

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI",
        Roboto, Helvetica, Arial, sans-serif;

    min-height: 100vh;
    color: #f5f1f4;

    background:
        linear-gradient(rgba(255,255,255,0.025) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,0.025) 1px, transparent 1px),
        #0d0c11;

    background-size: 45px 45px;
}


/* =========================
   NAVBAR
========================= */

.navbar {
    height: 76px;
    padding: 0 55px;

    display: flex;
    align-items: center;
    justify-content: space-between;

    background: rgba(14,13,18,0.92);
    border-bottom: 1px solid rgba(255,255,255,0.07);

    backdrop-filter: blur(15px);
}

.logo {
    color: #ffffff;
    font-size: 24px;
    font-weight: 850;
    text-decoration: none;
    letter-spacing: -0.5px;
}

.logo i {
    color: #b45a87;
    margin-right: 8px;
}

.logo span {
    color: #b45a87;
}

.nav-links {
    display: flex;
    align-items: center;
    gap: 28px;
    list-style: none;
}

.nav-links a {
    display: flex;
    align-items: center;
    gap: 7px;

    color: #bdb7bf;
    text-decoration: none;

    font-size: 13px;
    font-weight: 650;

    transition: 0.25s ease;
}

.nav-links a:hover {
    color: #d17ba5;
}

.register-btn {
    background: #a65380;
    color: #ffffff !important;

    padding: 10px 18px;
    border-radius: 30px;

    box-shadow: 0 8px 25px rgba(166,83,128,0.22);
}

.register-btn:hover {
    background: #bd6c98;
    color: #ffffff !important;
    transform: translateY(-1px);
}


/* =========================
   LOGIN AREA
========================= */

.login-container {
    min-height: calc(100vh - 76px);

    display: flex;
    align-items: center;
    justify-content: center;

    padding: 55px 20px;

    position: relative;
}

.login-container::before {
    content: "";

    position: absolute;

    width: 430px;
    height: 430px;

    background: rgba(166,83,128,0.12);

    filter: blur(110px);
    border-radius: 50%;

    pointer-events: none;
}


/* =========================
   LOGIN CARD
========================= */

.login-box {
    position: relative;
    z-index: 1;

    width: 430px;
    max-width: 100%;

    padding: 42px;

    background: rgba(25,23,30,0.94);

    border: 1px solid rgba(255,255,255,0.09);
    border-radius: 24px;

    box-shadow:
        0 30px 80px rgba(0,0,0,0.45),
        0 0 45px rgba(166,83,128,0.06);

    backdrop-filter: blur(18px);
}


/* =========================
   LOGIN ICON
========================= */

.login-icon {
    width: 64px;
    height: 64px;

    margin: 0 auto 20px;

    display: flex;
    align-items: center;
    justify-content: center;

    background: rgba(166,83,128,0.12);

    border: 1px solid rgba(166,83,128,0.3);

    border-radius: 18px;

    color: #c36d99;

    font-size: 25px;

    box-shadow: 0 0 25px rgba(166,83,128,0.12);
}


/* =========================
   TITLE
========================= */

.login-box h1 {
    text-align: center;

    font-size: 30px;
    font-weight: 850;

    color: #f8f3f6;

    margin-bottom: 8px;

    letter-spacing: -0.7px;
}

.subtitle {
    text-align: center;

    color: #9d969f;

    font-size: 13px;

    margin-bottom: 30px;
}


/* =========================
   MESSAGES
========================= */

.messages {
    margin-bottom: 20px;
}

.message {
    display: flex;
    align-items: center;
    gap: 9px;

    padding: 12px 14px;

    background: rgba(166,83,128,0.10);

    color: #dda1bd;

    border: 1px solid rgba(166,83,128,0.25);

    border-radius: 10px;

    margin-bottom: 9px;

    font-size: 12px;
    font-weight: 600;
}


/* =========================
   FORM
========================= */

.form-group {
    margin-bottom: 20px;
}

.form-group label {
    display: flex;
    align-items: center;
    gap: 7px;

    margin-bottom: 8px;

    color: #ded8dd;

    font-size: 13px;
    font-weight: 700;
}

.form-group label i {
    color: #b45a87;
    font-size: 12px;
}

.input-wrapper {
    position: relative;
}

.input-wrapper > i {
    position: absolute;

    left: 15px;
    top: 50%;

    transform: translateY(-50%);

    color: #77717a;

    font-size: 13px;
}

.form-group input {
    width: 100%;

    padding: 13px 14px 13px 42px;

    border: 1px solid rgba(255,255,255,0.09);

    border-radius: 12px;

    outline: none;

    background: #17151c;

    color: #ffffff;

    font-size: 14px;

    transition: 0.25s ease;
}

.form-group input::placeholder {
    color: #68636b;
}

.form-group input:focus {
    border-color: #a65380;

    background: #1b1820;

    box-shadow:
        0 0 0 3px rgba(166,83,128,0.12),
        0 0 20px rgba(166,83,128,0.05);
}


/* =========================
   LOGIN BUTTON
========================= */

.login-submit {
    width: 100%;

    display: flex;
    align-items: center;
    justify-content: center;
    gap: 9px;

    padding: 14px 18px;

    margin-top: 6px;

    background: #a65380;

    color: #ffffff;

    border: none;
    border-radius: 30px;

    cursor: pointer;

    font-size: 13px;
    font-weight: 800;

    transition: 0.25s ease;

    box-shadow: 0 10px 28px rgba(166,83,128,0.20);
}

.login-submit:hover {
    background: #bd6c98;

    transform: translateY(-2px);

    box-shadow: 0 14px 32px rgba(166,83,128,0.28);
}


/* =========================
   REGISTER LINK
========================= */

.register-link {
    margin-top: 25px;

    padding-top: 21px;

    border-top: 1px solid rgba(255,255,255,0.07);

    text-align: center;

    color: #858087;

    font-size: 13px;
}

.register-link a {
    color: #c36d99;

    text-decoration: none;

    font-weight: 800;

    transition: 0.2s;
}

.register-link a:hover {
    color: #e08bb3;
}


/* =========================
   RESPONSIVE
========================= */

@media (max-width: 700px) {

    .navbar {
        padding: 0 22px;
    }

    .nav-links {
        gap: 12px;
    }

    .nav-links li:not(:last-child) {
        display: none;
    }

    .login-container {
        min-height: calc(100vh - 70px);
        padding: 35px 18px;
    }

    .login-box {
        padding: 32px 25px;
        border-radius: 20px;
    }
}

@media (max-width: 400px) {

    .logo {
        font-size: 21px;
    }

    .login-box {
        padding: 28px 20px;
    }

    .login-box h1 {
        font-size: 26px;
    }
}
</style>
</head>

<body>

    <!-- ================= NAVBAR ================= -->

    <nav class="navbar">

        <a href="{% url 'index' %}" class="logo">
            <i class="fa-solid fa-screwdriver-wrench"></i>
            Tool<span>Box</span>
        </a>

        <ul class="nav-links">

            <li>
                <a href="{% url 'index' %}">
                    <i class="fa-solid fa-house"></i>
                    Home
                </a>
            </li>

            <li>
                <a href="#">
                    <i class="fa-solid fa-toolbox"></i>
                    Tools
                </a>
            </li>

            <li>
                <a href="#">
                    <i class="fa-solid fa-circle-info"></i>
                    About
                </a>
            </li>

            <li>
                <a href="#">
                    <i class="fa-solid fa-envelope"></i>
                    Contact
                </a>
            </li>

            <li>
                <a href="{% url 'user_register' %}" class="register-btn">
                    <i class="fa-solid fa-user-plus"></i>
                    Register
                </a>
            </li>

        </ul>

    </nav>


    <!-- ================= LOGIN ================= -->

    <div class="login-container">

        <div class="login-box">

            <div class="login-icon">
                <i class="fa-solid fa-lock"></i>
            </div>

            <h1>
                Welcome Back
            </h1>

            <p class="subtitle">
                Login to your ToolBox account
            </p>


            <!-- ================= DJANGO MESSAGES ================= -->

            {% if messages %}

            <div class="messages">

                {% for message in messages %}

                <div class="message">

                    <i class="fa-solid fa-circle-info"></i>

                    {{ message }}

                </div>

                {% endfor %}

            </div>

            {% endif %}


            <!-- ================= LOGIN FORM ================= -->

            <form method="POST">

                {% csrf_token %}

                <div class="form-group">

                    <label>
                        <i class="fa-solid fa-user"></i>
                        Username
                    </label>

                    <div class="input-wrapper">

                        <i class="fa-solid fa-user"></i>

                        <input
                            type="text"
                            name="username"
                            placeholder="Enter your username"
                            required
                        >

                    </div>

                </div>


                <div class="form-group">

                    <label>
                        <i class="fa-solid fa-lock"></i>
                        Password
                    </label>

                    <div class="input-wrapper">

                        <i class="fa-solid fa-lock"></i>

                        <input
                            type="password"
                            name="password"
                            placeholder="Enter your password"
                            required
                        >

                    </div>

                </div>


                <button type="submit" class="login-submit">

                    <i class="fa-solid fa-right-to-bracket"></i>
                    Login

                </button>

            </form>


            <!-- ================= REGISTER LINK ================= -->

            <div class="register-link">

                <p>
                    Don't have an account?
                    <a href="{% url 'user_register' %}">
                        Register
                    </a>
                </p>

            </div>

        </div>

    </div>

</body>

</html>
