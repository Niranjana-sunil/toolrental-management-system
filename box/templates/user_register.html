<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>ToolBox | Register</title>

    <!-- Font Awesome -->
    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    >

   <style>
/* =========================
   GLOBAL
========================= */

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI",
        Roboto, Helvetica, Arial, sans-serif;

    min-height: 100vh;

    color: #f5f1f4;

    background:
        linear-gradient(rgba(255,255,255,0.025) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,0.025) 1px, transparent 1px),
        #0d0c11;

    background-size: 45px 45px;
}


/* =========================
   NAVBAR
========================= */

.navbar {
    height: 76px;

    padding: 0 55px;

    display: flex;
    align-items: center;
    justify-content: space-between;

    background: rgba(14,13,18,0.92);

    border-bottom: 1px solid rgba(255,255,255,0.07);

    backdrop-filter: blur(15px);
}

.logo {
    font-size: 24px;
    font-weight: 850;

    color: #ffffff;

    text-decoration: none;

    letter-spacing: -0.5px;
}

.logo i {
    color: #b45a87;
    margin-right: 8px;
}

.logo span {
    color: #b45a87;
}

.nav-links {
    display: flex;
    align-items: center;
    gap: 28px;

    list-style: none;
}

.nav-links a {
    display: flex;
    align-items: center;
    gap: 7px;

    color: #bdb7bf;

    text-decoration: none;

    font-size: 13px;
    font-weight: 650;

    transition: 0.25s ease;
}

.nav-links a:hover {
    color: #d17ba5;
}


/* =========================
   LOGIN BUTTON
========================= */

.login-btn {
    background: #a65380;

    color: #ffffff !important;

    padding: 10px 19px;

    border-radius: 30px;

    box-shadow: 0 8px 25px rgba(166,83,128,0.22);

    transition: 0.25s ease;
}

.login-btn:hover {
    background: #bd6c98;

    transform: translateY(-1px);
}


/* =========================
   REGISTER CONTAINER
========================= */

.register-container {
    min-height: calc(100vh - 76px);

    display: flex;
    justify-content: center;
    align-items: center;

    padding: 50px 20px;

    position: relative;
}

.register-container::before {
    content: "";

    position: absolute;

    width: 480px;
    height: 480px;

    background: rgba(166,83,128,0.11);

    filter: blur(120px);

    border-radius: 50%;

    pointer-events: none;
}


/* =========================
   REGISTER CARD
========================= */

.register-box {
    position: relative;
    z-index: 1;

    width: 480px;
    max-width: 100%;

    padding: 40px 42px;

    background: rgba(25,23,30,0.95);

    border: 1px solid rgba(255,255,255,0.09);

    border-radius: 24px;

    box-shadow:
        0 30px 80px rgba(0,0,0,0.45),
        0 0 45px rgba(166,83,128,0.06);

    backdrop-filter: blur(18px);
}


/* =========================
   REGISTER ICON
========================= */

.register-icon {
    width: 64px;
    height: 64px;

    margin: 0 auto 18px;

    background: rgba(166,83,128,0.12);

    border: 1px solid rgba(166,83,128,0.30);

    border-radius: 18px;

    display: flex;
    align-items: center;
    justify-content: center;

    color: #c36d99;

    font-size: 25px;

    box-shadow: 0 0 25px rgba(166,83,128,0.12);
}


/* =========================
   TITLE
========================= */

.register-box h2 {
    text-align: center;

    color: #f8f3f6;

    font-size: 30px;

    font-weight: 850;

    margin-bottom: 8px;

    letter-spacing: -0.7px;
}

.subtitle {
    text-align: center;

    color: #9d969f;

    margin-bottom: 30px;

    font-size: 13px;
}


/* =========================
   MESSAGES
========================= */

.messages {
    margin-bottom: 20px;
}

.messages p {
    display: flex;
    align-items: center;
    justify-content: center;

    background: rgba(166,83,128,0.10);

    color: #dda1bd;

    border: 1px solid rgba(166,83,128,0.25);

    padding: 12px 14px;

    border-radius: 10px;

    text-align: center;

    font-size: 12px;

    margin-bottom: 8px;
}


/* =========================
   FORM
========================= */

.form-group {
    margin-bottom: 17px;
}

.form-group label {
    display: block;

    margin-bottom: 8px;

    color: #ded8dd;

    font-weight: 700;

    font-size: 13px;
}

.input-wrapper {
    position: relative;
}

.input-wrapper i {
    position: absolute;

    left: 15px;
    top: 50%;

    transform: translateY(-50%);

    color: #77717a;

    font-size: 13px;

    pointer-events: none;
}

.input-wrapper input {
    padding-left: 42px !important;
}

.form-group input,
.form-group textarea {
    width: 100%;

    padding: 13px 14px;

    border: 1px solid rgba(255,255,255,0.09);

    border-radius: 12px;

    font-size: 14px;

    outline: none;

    background: #17151c;

    color: #ffffff;

    font-family: inherit;

    transition: 0.25s ease;
}

.form-group input::placeholder,
.form-group textarea::placeholder {
    color: #68636b;
}

.form-group input:focus,
.form-group textarea:focus {
    border-color: #a65380;

    background: #1b1820;

    box-shadow:
        0 0 0 3px rgba(166,83,128,0.12),
        0 0 20px rgba(166,83,128,0.05);
}

.form-group textarea {
    height: 85px;

    resize: vertical;

    min-height: 70px;
}


/* =========================
   REGISTER BUTTON
========================= */

.register-submit {
    width: 100%;

    padding: 14px;

    display: flex;
    align-items: center;
    justify-content: center;

    gap: 7px;

    background: #a65380;

    color: #ffffff;

    border: none;

    border-radius: 30px;

    font-size: 14px;

    font-weight: 800;

    cursor: pointer;

    margin-top: 5px;

    transition: 0.25s ease;

    box-shadow: 0 10px 28px rgba(166,83,128,0.20);
}

.register-submit i {
    color: #ffffff;

    transition: 0.25s ease;
}

.register-submit:hover {
    background: #bd6c98;

    transform: translateY(-2px);

    box-shadow: 0 14px 32px rgba(166,83,128,0.28);
}

.register-submit:hover i {
    color: #ffffff;

    transform: translateX(3px);
}


/* =========================
   LOGIN LINK
========================= */

.login-link {
    text-align: center;

    margin-top: 23px;

    padding-top: 21px;

    border-top: 1px solid rgba(255,255,255,0.07);

    font-size: 13px;

    color: #858087;
}

.login-link a {
    color: #c36d99;

    text-decoration: none;

    font-weight: 800;

    transition: 0.2s;
}

.login-link a:hover {
    color: #e08bb3;
}


/* =========================
   RESPONSIVE
========================= */

@media (max-width: 700px) {

    .navbar {
        padding: 0 22px;
    }

    .nav-links {
        gap: 12px;
    }

    .nav-links li:not(:last-child) {
        display: none;
    }

    .register-container {
        padding: 35px 18px;
    }

    .register-box {
        padding: 32px 25px;

        border-radius: 20px;
    }
}

@media (max-width: 450px) {

    .navbar {
        padding: 0 18px;
    }

    .logo {
        font-size: 21px;
    }

    .register-box {
        padding: 28px 20px;
    }

    .register-box h2 {
        font-size: 26px;
    }
}
</style>
</head>

<body>

    <!-- ================= NAVBAR ================= -->

    <nav class="navbar">

        <a href="{% url 'index' %}" class="logo">
            <i class="fa-solid fa-screwdriver-wrench"></i>
            Tool<span>Box</span>
        </a>

        <ul class="nav-links">

            <li>
                <a href="{% url 'index' %}">
                    Home
                </a>
            </li>

            <li>
                <a href="#">
                    Tools
                </a>
            </li>

            <li>
                <a href="#">
                    About
                </a>
            </li>

            <li>
                <a href="#">
                    Contact
                </a>
            </li>

            <li>
                <a href="{% url 'user_login' %}" class="login-btn">
                    Login
                </a>
            </li>

        </ul>

    </nav>


    <!-- ================= REGISTRATION ================= -->

    <div class="register-container">

        <div class="register-box">

            <div class="register-icon">
                <i class="fa-solid fa-user-plus"></i>
            </div>

            <h2>Create Account</h2>

            <p class="subtitle">
                Register with ToolBox
            </p>


            <!-- Django Messages -->

            {% if messages %}

                <div class="messages">

                    {% for message in messages %}

                        <p>{{ message }}</p>

                    {% endfor %}

                </div>

            {% endif %}


            <form method="POST">

                {% csrf_token %}


                <div class="form-group">

                    <label>
                        Username
                    </label>

                    <div class="input-wrapper">

                        <i class="fa-solid fa-user"></i>

                        <input
                            type="text"
                            name="username"
                            placeholder="Enter your username"
                            required
                        >

                    </div>

                </div>


                <div class="form-group">

                    <label>
                        Address
                    </label>

                    <textarea
                        name="address"
                        placeholder="Enter your address"
                        required
                    ></textarea>

                </div>


                <div class="form-group">

                    <label>
                        Phone Number
                    </label>

                    <div class="input-wrapper">

                        <i class="fa-solid fa-phone"></i>

                        <input
                            type="tel"
                            name="phone"
                            placeholder="Enter 10 digit phone number"
                            minlength="10"
                            maxlength="10"
                            required
                        >

                    </div>

                </div>


                <div class="form-group">

                    <label>
                        Password
                    </label>

                    <div class="input-wrapper">

                        <i class="fa-solid fa-lock"></i>

                        <input
                            type="password"
                            name="password"
                            placeholder="Enter your password"
                            required
                        >

                    </div>

                </div>


                <div class="form-group">

                    <label>
                        Confirm Password
                    </label>

                    <div class="input-wrapper">

                        <i class="fa-solid fa-lock"></i>

                        <input
                            type="password"
                            name="c_password"
                            placeholder="Confirm your password"
                            required
                        >

                    </div>

                </div>


                <button type="submit" class="register-submit">
                    Create Account
                    <i class="fa-solid fa-arrow-right"></i>
                </button>

            </form>


            <div class="login-link">

                <p>
                    Already have an account?
                    <a href="{% url 'user_login' %}">
                        Login
                    </a>
                </p>

            </div>

        </div>

    </div>

</body>
</html>
